{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h3>Редактировать запись здоровья</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="{{ form.weight.id_for_label }}" class="form-label">Вес (кг)</label>
                        <input type="number" step="0.1" class="form-control" id="{{ form.weight.id_for_label }}" name="{{ form.weight.name }}" value="{{ object.weight|default_if_none:'' }}">
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.date.id_for_label }}" class="form-label">Дата измерения</label>
                        <input type="date" class="form-control" id="{{ form.date.id_for_label }}" name="{{ form.date.name }}" value="{{ object.date|date:'Y-m-d'|default_if_none:'' }}" required>
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.systolic_pressure.id_for_label }}" class="form-label">Систолическое давление (мм рт. ст.)</label>
                        <input type="number" class="form-control" id="{{ form.systolic_pressure.id_for_label }}" name="{{ form.systolic_pressure.name }}" value="{{ object.systolic_pressure|default_if_none:'' }}">
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.diastolic_pressure.id_for_label }}" class="form-label">Диастолическое давление (мм рт. ст.)</label>
                        <input type="number" class="form-control" id="{{ form.diastolic_pressure.id_for_label }}" name="{{ form.diastolic_pressure.name }}" value="{{ object.diastolic_pressure|default_if_none:'' }}">
                    </div>
                    <div class="mb-3">
                        <label for="{{ form.pulse.id_for_label }}" class="form-label">Пульс (уд/мин)</label>
                        <input type="number" class="form-control" id="{{ form.pulse.id_for_label }}" name="{{ form.pulse.name }}" value="{{ object.pulse|default_if_none:'' }}">
                    </div>
                    <button type="submit" class="btn btn-primary">Проверить изменения</button>
                    <a href="{% url 'weight-list' %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
